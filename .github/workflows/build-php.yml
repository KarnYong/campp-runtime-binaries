name: Build PHP-FPM (Linux/macOS)

# Static php-fpm for CAMPP on Linux and macOS, built with static-php-cli.
# Use this when dl.static-php.dev has no build for a needed PHP release yet
# (e.g. a security fix). Output: php-<ver>-fpm-<os>-<arch>.tar.gz containing
# only `php-fpm`, the same layout as the static-php.dev bulk builds CAMPP uses.

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: 'Exact PHP version (e.g. 8.5.12)'
        required: true
      release_tag:
        description: 'Release to upload to (e.g. php-8.5.12). Leave empty to only keep artifacts.'
        required: false
        default: ''

permissions:
  contents: write

env:
  SPC_REF: '2.8.5'
  # Same set as the static-php.dev "bulk" builds CAMPP shipped before, plus
  # pdo_pgsql and pdo_sqlite (missing there, needed for PDO with PostgreSQL/SQLite).
  EXTENSIONS: 'apcu,bcmath,bz2,calendar,ctype,curl,dba,dom,event,exif,fileinfo,filter,ftp,gd,gmp,iconv,imagick,imap,intl,mbregex,mbstring,mysqli,mysqlnd,opcache,openssl,opentelemetry,pcntl,pdo,pdo_mysql,pdo_pgsql,pdo_sqlite,pgsql,phar,posix,protobuf,readline,redis,session,shmop,simplexml,soap,sockets,sodium,sqlite3,swoole,sysvmsg,sysvsem,sysvshm,tokenizer,xml,xmlreader,xmlwriter,xsl,zip,zlib'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runs-on: ubuntu-latest
            spc: ./bin/spc-alpine-docker
          - target: linux-aarch64
            runs-on: ubuntu-24.04-arm
            spc: ./bin/spc-alpine-docker
          - target: macos-x86_64
            runs-on: macos-15-intel
            spc: ./bin/spc
          - target: macos-aarch64
            runs-on: macos-15
            spc: ./bin/spc
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 180
    env:
      ASSET: php-${{ inputs.php_version }}-fpm-${{ matrix.target }}.tar.gz

    steps:
      - name: Checkout static-php-cli ${{ env.SPC_REF }}
        uses: actions/checkout@v5
        with:
          repository: crazywhalecc/static-php-cli
          ref: ${{ env.SPC_REF }}

      - name: Setup PHP (runs static-php-cli itself)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install static-php-cli
        run: composer install --no-dev --classmap-authoritative --no-interaction

      - name: Prepare macOS toolchain
        if: runner.os == 'macOS'
        run: ./bin/spc doctor --auto-fix

      - name: Cache sources
        uses: actions/cache@v4
        with:
          path: downloads
          key: spc-src-${{ matrix.target }}-${{ inputs.php_version }}-${{ hashFiles('config/source.json') }}
          restore-keys: spc-src-${{ matrix.target }}-

      - name: Download sources
        run: >
          ${{ matrix.spc }} download
          --with-php=${{ inputs.php_version }}
          --for-extensions="${{ env.EXTENSIONS }}"
          --ignore-cache-sources=php-src
          --prefer-pre-built
          --retry=3

      - name: Build php-fpm
        run: ${{ matrix.spc }} build "${{ env.EXTENSIONS }}" --build-fpm --with-suggested-libs

      - name: Package and verify
        run: |
          set -euo pipefail
          BIN=buildroot/bin/php-fpm
          "$BIN" -v
          "$BIN" -v | grep -q "PHP ${{ inputs.php_version }} " || { echo "::error::wrong PHP version"; exit 1; }
          for ext in pdo_pgsql pdo_mysql pgsql mysqli mbstring intl gd openssl curl "Zend OPcache"; do
            "$BIN" -m | grep -qx "$ext" || { echo "::error::missing extension $ext"; exit 1; }
          done
          tar -czf "$ASSET" -C buildroot/bin php-fpm
          shasum -a 256 "$ASSET" | tee "$ASSET.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.target }}
          path: log/
          if-no-files-found: ignore

  release:
    needs: build
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to release ${{ inputs.release_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          cat dist/*.sha256
          gh release upload "${{ inputs.release_tag }}" dist/*.tar.gz --clobber --repo "${{ github.repository }}"
